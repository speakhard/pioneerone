# Cast and crew.
#
# The original site had /about/cast/ and /about/crew/ pages, but both were
# published empty and stayed that way, so there is no authoritative list to
# recover. This one is assembled from two sources, and `source` records which:
#
#   "channel"   named in the episode descriptions on the production's own
#               YouTube channel — Josh's own current copy, so treated as solid
#   "wikipedia" listed on the Pioneer One Wikipedia article and not confirmed
#               anywhere the production wrote itself — please check these
#   "blog"      named in a pioneerone.tv post at the time
#
# These are real people's screen credits. If anything here is wrong or missing
# it should be fixed before anyone else reads it — see STORY-SOURCES.md.

